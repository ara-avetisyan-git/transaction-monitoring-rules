[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transaction-monitoring-rules"
version = "0.1.0"
description = "Rule-based transaction monitoring with an optional anomaly-detection comparison, on synthetic data."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ara Avetisyan" }]
dependencies = ["pandas>=2.0", "numpy>=1.24", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=7", "scikit-learn>=1.3"]
ml = ["scikit-learn>=1.3"]

[project.scripts]
tm-rules = "tm_rules.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tm_rules = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
